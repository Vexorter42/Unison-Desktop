name: macOS Apple Silicon

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to upload DMG to (leave empty for build check)'
        required: false
        type: string
      runner:
        description: 'Apple Silicon runner'
        required: true
        default: macos-15
        type: choice
        options:
          - macos-15
          - macos-26

permissions:
  contents: write

jobs:
  package:
    runs-on: ${{ inputs.runner || 'macos-15' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install build-time VLC for Apple Silicon
        run: |
          brew install --cask vlc
          chmod +x gradlew
          ./gradlew macVlcCheck --console=plain
      - name: Build Apple Silicon DMG
        run: |
          test "$(uname -m)" = arm64
          bash scripts/create-macos-icon.sh
          chmod +x gradlew
          if ! ./gradlew packageDmg --console=plain; then
            find build/compose/logs -type f -maxdepth 4 -print -exec cat {} \;
            exit 1
          fi
          dmg=$(find build/compose/binaries/main/dmg -maxdepth 1 -name '*.dmg' -print -quit)
          test -n "$dmg"
          mkdir -p dist
          cp "$dmg" "dist/Unison-Desktop-${{ inputs.release_tag || 'build' }}-macos-arm64.dmg"
      - name: Check playback without installed VLC
        run: |
          find build/compose/binaries/main/app -name libvlc.dylib -print | grep -q .
          brew uninstall --cask vlc
          test ! -d /Applications/VLC.app
          ./gradlew macBundledVlcCheck --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: unison-macos-arm64
          path: dist/*.dmg
          if-no-files-found: error
      - name: Add DMG to release
        if: ${{ inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.release_tag }}" dist/*.dmg --clobber
